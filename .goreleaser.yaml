version: 2

project_name: hive

builds:
  - main: .
    binary: hive
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: install.sh

changelog:
  use: github
  sort: asc

release:
  draft: true
  extra_files:
    - glob: install.sh
  github:
    owner: sperka
    name: hive
